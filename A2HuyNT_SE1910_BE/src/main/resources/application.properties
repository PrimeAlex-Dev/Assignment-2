# Server Port
server.port=8080

# MS SQL Server DataSource Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A2HuyNT_SE1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Configuration
# ddl-auto: update se tu dong tao moi bang hoac cap nhat schema tu cac Entity JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
